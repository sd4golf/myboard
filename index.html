<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Board</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14171c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Board">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
  :root{
    --bg:#14171c; --panel:#1d2129; --panel2:#232936; --border:#2c3340;
    --text:#e6e9ef; --muted:#8b93a3; --accent:#4f8cff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 700px at 20% -10%, #1b2130 0%, var(--bg) 55%);
    color:var(--text);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
    min-height:100vh;
    touch-action:manipulation; /* disables double-tap zoom so dblclick-to-edit works on iOS */
  }
  /* ---------- toolbar ---------- */
  #toolbar{
    position:sticky; top:0; z-index:100000;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left));
    background:rgba(20,23,28,.85); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  #toolbar .brand{font-weight:700; letter-spacing:.3px; margin-right:10px}
  #toolbar .spacer{flex:1}
  button{
    background:var(--panel2); color:var(--text);
    border:1px solid var(--border); border-radius:7px;
    padding:6px 12px; cursor:pointer; font:inherit;
  }
  button:hover{background:#2b3342; border-color:#3a4252}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  #status{color:var(--muted); font-size:12px; min-width:90px; text-align:right}
  /* ---------- desk & windows ---------- */
  #desk{position:relative; width:100%; min-height:calc(100vh - 54px)}
  .win{
    position:absolute; display:flex; flex-direction:column;
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    min-width:200px; min-height:140px; overflow:hidden;
  }
  .titlebar{
    display:flex; align-items:center; gap:8px;
    padding:8px 10px; cursor:grab; user-select:none; -webkit-user-select:none;
    background:var(--panel2); border-bottom:1px solid var(--border);
    touch-action:none; /* finger-drag moves the window instead of scrolling the page */
  }
  .titlebar:active{cursor:grabbing}
  .colordot{
    width:12px; height:12px; border-radius:50%; flex:none;
    border:1px solid rgba(255,255,255,.25); cursor:pointer; padding:0; background:none;
  }
  .wtitle{
    flex:1; margin:0; font-size:14px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .wtitle-input{
    flex:1; font:inherit; font-weight:600; color:var(--text);
    background:var(--bg); border:1px solid var(--accent); border-radius:5px; padding:2px 6px;
    min-width:0;
  }
  .barbtn{
    flex:none; border:none; background:none; color:var(--muted);
    font-size:15px; line-height:1; padding:2px 6px; border-radius:5px; cursor:pointer;
  }
  .barbtn:hover{background:rgba(255,255,255,.1); color:var(--text)}
  .closebtn:hover{background:#e35d6a; color:#fff}
  .win-body{flex:1; overflow:auto; padding:8px 10px; -webkit-overflow-scrolling:touch}
  .resizer{
    position:absolute; right:0; bottom:0; width:18px; height:18px;
    cursor:nwse-resize; z-index:5; touch-action:none;
    background:linear-gradient(135deg, transparent 50%, var(--muted) 50%, var(--muted) 60%, transparent 60%, transparent 70%, var(--muted) 70%, var(--muted) 80%, transparent 80%);
    opacity:.5;
  }
  .resizer:hover{opacity:1}
  /* ---------- task list ---------- */
  ul.items{list-style:none; margin:0; padding:0}
  ul.items li{
    display:flex; align-items:center; gap:7px;
    padding:4px 2px; border-radius:6px;
  }
  ul.items li:hover{background:rgba(255,255,255,.04)}
  ul.items li .itxt{flex:1; cursor:default; word-break:break-word}
  ul.items li.done .itxt{text-decoration:line-through; color:var(--muted)}
  ul.items li input[type=checkbox]{accent-color:var(--accent); flex:none}
  ul.items li .ibtn{
    flex:none; border:none; background:none; color:var(--muted);
    padding:0 4px; cursor:pointer; font-size:12px; visibility:hidden; border-radius:4px;
  }
  ul.items li:hover .ibtn{visibility:visible}
  ul.items li .ibtn:hover{color:var(--text); background:rgba(255,255,255,.08)}
  ul.items li .idel:hover{color:#fff; background:#e35d6a}
  .iedit{
    flex:1; font:inherit; color:var(--text); min-width:0;
    background:var(--bg); border:1px solid var(--accent); border-radius:5px; padding:2px 6px;
  }
  .addrow{display:flex; margin-top:6px}
  .addrow input{
    flex:1; font:inherit; color:var(--text); min-width:0;
    background:var(--bg); border:1px solid var(--border); border-radius:7px; padding:6px 9px;
  }
  .addrow input:focus{outline:none; border-color:var(--accent)}
  .addrow input::placeholder{color:var(--muted)}
  /* ---------- notes ---------- */
  textarea.notes{
    width:100%; height:100%; resize:none; font:inherit; color:var(--text);
    background:transparent; border:none; outline:none; padding:2px;
  }
  /* ---------- calendar ---------- */
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px}
  .cal-head .cal-label{font-weight:600}
  .cal-head button{padding:2px 9px}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center}
  .cal-grid .dow{color:var(--muted); font-size:11px; padding:2px 0}
  .cal-grid .day{padding:4px 0; border-radius:6px; font-size:12px}
  .cal-grid .day.other{color:#4a5262}
  .cal-grid .day.today{background:var(--accent); color:#fff; font-weight:700}
  .hint{color:var(--muted); font-size:12px; padding:8px 14px}
  /* ---------- touch devices (phones / tablets) ---------- */
  @media (hover: none){
    ul.items li .ibtn{visibility:visible; font-size:14px; padding:3px 7px}
    .barbtn{font-size:17px; padding:4px 8px}
    .resizer{width:28px; height:28px; opacity:.8}
    .colordot{width:16px; height:16px}
    .hint{display:none}
  }
</style>
</head>
<body>

<header id="toolbar">
  <span class="brand">&#9707; My Board</span>
  <button class="primary" data-new="list">+ Task List</button>
  <button class="primary" data-new="notes">+ Notes</button>
  <button class="primary" data-new="calendar">+ Calendar</button>
  <span class="spacer"></span>
  <button id="exportBtn" title="Save everything to a portable .properties file">&#128190; Save to file</button>
  <button id="importBtn" title="Load a previously saved .properties file">&#128194; Load from file</button>
  <input type="file" id="importInput" accept=".properties,.txt" hidden>
  <span id="status"></span>
</header>

<div class="hint">Drag windows by their title bar &middot; resize from the bottom-right corner &middot; rename with the &#9998; button or double-click &middot; everything autosaves in this browser; use &ldquo;Save to file&rdquo; for a portable copy.</div>

<div id="desk"></div>

<script>
"use strict";

var STORAGE_KEY = "myBoardState";
var COLORS = ["#4f8cff", "#34c98e", "#f2a83b", "#e35d6a", "#a06bfa", "#31b3c2"];
var desk = document.getElementById("desk");
var statusEl = document.getElementById("status");
var state = null;
var fileHandle = null;          // File System Access handle (Chrome/Edge) for quick re-save
var calViews = {};              // per-calendar-window month being viewed (not persisted)

/* ================= state ================= */

function uid() { return "w" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function defaultState() {
  return {
    nextZ: 10,
    windows: [
      { id: uid(), type: "list", title: "Life Goals",       x: 30,  y: 20,  w: 290, h: 260, z: 1, color: COLORS[4], items: [{ text: "Add your big-picture goals here", done: false }], notes: "" },
      { id: uid(), type: "list", title: "Short Term Goals", x: 350, y: 20,  w: 290, h: 260, z: 2, color: COLORS[1], items: [{ text: "Something for this month", done: false }], notes: "" },
      { id: uid(), type: "list", title: "Work Tasks",       x: 30,  y: 310, w: 290, h: 240, z: 3, color: COLORS[0], items: [], notes: "" },
      { id: uid(), type: "calendar", title: "Calendar",     x: 670, y: 20,  w: 300, h: 300, z: 4, color: COLORS[2], items: [], notes: "" }
    ]
  };
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* private mode etc. */ }
}

function load() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { state = JSON.parse(raw); return; }
  } catch (e) { /* fall through */ }
  state = defaultState();
  save();
}

function flash(msg) {
  statusEl.textContent = msg;
  clearTimeout(flash._t);
  flash._t = setTimeout(function () { statusEl.textContent = ""; }, 2500);
}

/* ================= rendering ================= */

function render() {
  desk.innerHTML = "";
  state.windows.forEach(function (w) { desk.appendChild(buildWindow(w)); });
}

function bringToFront(w, el) {
  if (w.z < state.nextZ - 1) {
    w.z = state.nextZ++;
    el.style.zIndex = w.z;
    save();
  }
}

function buildWindow(w) {
  var el = document.createElement("div");
  el.className = "win";
  el.style.left = w.x + "px";
  el.style.top = w.y + "px";
  el.style.width = w.w + "px";
  el.style.height = w.h + "px";
  el.style.zIndex = w.z;
  el.style.borderTop = "3px solid " + w.color;

  el.addEventListener("pointerdown", function () { bringToFront(w, el); });

  /* --- title bar --- */
  var bar = document.createElement("div");
  bar.className = "titlebar";

  var dot = document.createElement("button");
  dot.className = "colordot";
  dot.style.background = w.color;
  dot.title = "Click to change window color";
  dot.addEventListener("click", function () {
    w.color = COLORS[(COLORS.indexOf(w.color) + 1) % COLORS.length];
    dot.style.background = w.color;
    el.style.borderTop = "3px solid " + w.color;
    save();
  });

  var title = document.createElement("h2");
  title.className = "wtitle";
  title.textContent = w.title;
  title.title = "Double-click to rename";

  function startRename() {
    if (!title.parentNode) return; // already editing
    var inp = document.createElement("input");
    inp.className = "wtitle-input";
    inp.value = w.title;
    title.replaceWith(inp);
    inp.focus();
    inp.select();
    function commit() {
      var v = inp.value.trim();
      if (v) w.title = v;
      title.textContent = w.title;
      inp.replaceWith(title);
      save();
    }
    inp.addEventListener("blur", commit);
    inp.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") inp.blur();
      if (ev.key === "Escape") { inp.value = w.title; inp.blur(); }
    });
  }
  title.addEventListener("dblclick", startRename);

  var rename = document.createElement("button");
  rename.className = "barbtn";
  rename.innerHTML = "&#9998;";
  rename.title = "Rename this window";
  rename.addEventListener("click", startRename);

  var close = document.createElement("button");
  close.className = "barbtn closebtn";
  close.innerHTML = "&#10005;";
  close.title = "Remove this window";
  close.addEventListener("click", function () {
    var hasContent = (w.items && w.items.length) || (w.notes && w.notes.trim());
    if (hasContent && !confirm('Remove "' + w.title + '" and everything in it?')) return;
    state.windows = state.windows.filter(function (x) { return x.id !== w.id; });
    el.remove();
    save();
  });

  bar.append(dot, title, rename, close);
  el.appendChild(bar);

  /* --- body --- */
  var body = document.createElement("div");
  body.className = "win-body";
  if (w.type === "notes") buildNotes(w, body);
  else if (w.type === "calendar") buildCalendar(w, body);
  else buildList(w, body);
  el.appendChild(body);

  /* --- resize handle --- */
  var rz = document.createElement("div");
  rz.className = "resizer";
  rz.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    e.stopPropagation();
    bringToFront(w, el);
    var sx = e.clientX, sy = e.clientY, ow = w.w, oh = w.h;
    function move(ev) {
      w.w = Math.max(200, ow + ev.clientX - sx);
      w.h = Math.max(140, oh + ev.clientY - sy);
      el.style.width = w.w + "px";
      el.style.height = w.h + "px";
    }
    function up() {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      document.removeEventListener("pointercancel", up);
      save();
    }
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
    document.addEventListener("pointercancel", up);
  });
  el.appendChild(rz);

  /* --- dragging via title bar --- */
  bar.addEventListener("pointerdown", function (e) {
    if (e.target.closest("button,input")) return;
    e.preventDefault();
    var sx = e.clientX, sy = e.clientY, ox = w.x, oy = w.y;
    function move(ev) {
      w.x = Math.max(0, ox + ev.clientX - sx);
      w.y = Math.max(0, oy + ev.clientY - sy);
      el.style.left = w.x + "px";
      el.style.top = w.y + "px";
    }
    function up() {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      document.removeEventListener("pointercancel", up);
      save();
    }
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
    document.addEventListener("pointercancel", up);
  });

  return el;
}

/* ---------- task list windows ---------- */

function buildList(w, body) {
  var ul = document.createElement("ul");
  ul.className = "items";

  var addRow = document.createElement("div");
  addRow.className = "addrow";
  var addInp = document.createElement("input");
  addInp.placeholder = "Add a task and press Enter…";
  addInp.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && addInp.value.trim()) {
      w.items.push({ text: addInp.value.trim(), done: false });
      addInp.value = "";
      renderItems(w, ul);
      save();
    }
  });
  addRow.appendChild(addInp);

  body.append(ul, addRow);
  renderItems(w, ul);
}

function renderItems(w, ul) {
  ul.innerHTML = "";
  w.items.forEach(function (it, idx) {
    var li = document.createElement("li");
    if (it.done) li.classList.add("done");

    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = it.done;
    cb.addEventListener("change", function () {
      it.done = cb.checked;
      li.classList.toggle("done", it.done);
      save();
    });

    var span = document.createElement("span");
    span.className = "itxt";
    span.textContent = it.text;
    span.title = "Double-click to edit";

    function editItem() {
      if (!span.parentNode) return; // already editing
      var inp = document.createElement("input");
      inp.className = "iedit";
      inp.value = it.text;
      span.replaceWith(inp);
      inp.focus();
      inp.select();
      inp.addEventListener("blur", function () {
        var v = inp.value.trim();
        if (v) it.text = v;
        renderItems(w, ul);
        save();
      });
      inp.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") inp.blur();
        if (ev.key === "Escape") { inp.value = it.text; inp.blur(); }
      });
    }
    span.addEventListener("dblclick", editItem);

    var edit = mkItemBtn("✎", "Edit", editItem);
    var up = mkItemBtn("▲", "Move up", function () {
      if (idx > 0) {
        w.items.splice(idx - 1, 0, w.items.splice(idx, 1)[0]);
        renderItems(w, ul);
        save();
      }
    });
    var down = mkItemBtn("▼", "Move down", function () {
      if (idx < w.items.length - 1) {
        w.items.splice(idx + 1, 0, w.items.splice(idx, 1)[0]);
        renderItems(w, ul);
        save();
      }
    });
    var del = mkItemBtn("✕", "Delete", function () {
      w.items.splice(idx, 1);
      renderItems(w, ul);
      save();
    });
    del.classList.add("idel");

    li.append(cb, span, edit, up, down, del);
    ul.appendChild(li);
  });
}

function mkItemBtn(label, tip, onClick) {
  var b = document.createElement("button");
  b.className = "ibtn";
  b.textContent = label;
  b.title = tip;
  b.addEventListener("click", onClick);
  return b;
}

/* ---------- notes windows ---------- */

function buildNotes(w, body) {
  var ta = document.createElement("textarea");
  ta.className = "notes";
  ta.placeholder = "Type your notes here…";
  ta.value = w.notes || "";
  ta.addEventListener("input", function () {
    w.notes = ta.value;
    save();
  });
  body.appendChild(ta);
}

/* ---------- calendar windows ---------- */

function buildCalendar(w, body) {
  var now = new Date();
  if (!calViews[w.id]) calViews[w.id] = { y: now.getFullYear(), m: now.getMonth() };

  var head = document.createElement("div");
  head.className = "cal-head";
  var prev = document.createElement("button");
  prev.textContent = "‹";
  var label = document.createElement("span");
  label.className = "cal-label";
  var next = document.createElement("button");
  next.textContent = "›";
  head.append(prev, label, next);

  var grid = document.createElement("div");
  grid.className = "cal-grid";
  body.append(head, grid);

  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var DOWS = ["S","M","T","W","T","F","S"];

  function draw() {
    var v = calViews[w.id];
    label.textContent = MONTHS[v.m] + " " + v.y;
    grid.innerHTML = "";
    DOWS.forEach(function (d) {
      var c = document.createElement("div");
      c.className = "dow";
      c.textContent = d;
      grid.appendChild(c);
    });
    var first = new Date(v.y, v.m, 1).getDay();
    var days = new Date(v.y, v.m + 1, 0).getDate();
    var prevDays = new Date(v.y, v.m, 0).getDate();
    var today = new Date();
    for (var i = 0; i < 42; i++) {
      var c = document.createElement("div");
      c.className = "day";
      var d = i - first + 1;
      if (d < 1) {
        c.textContent = prevDays + d;
        c.classList.add("other");
      } else if (d > days) {
        if (i % 7 === 0 && d > days) break; // stop at a clean row boundary
        c.textContent = d - days;
        c.classList.add("other");
      } else {
        c.textContent = d;
        if (d === today.getDate() && v.m === today.getMonth() && v.y === today.getFullYear())
          c.classList.add("today");
      }
      grid.appendChild(c);
    }
  }

  prev.addEventListener("click", function () {
    var v = calViews[w.id];
    v.m--; if (v.m < 0) { v.m = 11; v.y--; }
    draw();
  });
  next.addEventListener("click", function () {
    var v = calViews[w.id];
    v.m++; if (v.m > 11) { v.m = 0; v.y++; }
    draw();
  });

  draw();
}

/* ================= new windows ================= */

document.querySelectorAll("[data-new]").forEach(function (btn) {
  btn.addEventListener("click", function () {
    var type = btn.getAttribute("data-new");
    var n = state.windows.length;
    var w = {
      id: uid(),
      type: type,
      title: type === "calendar" ? "Calendar" : type === "notes" ? "Notes" : "New List",
      x: 20 + (n % 6) * 25,
      y: 20 + (n % 6) * 25,
      w: type === "calendar" ? 300 : 280,
      h: type === "calendar" ? 300 : 240,
      z: state.nextZ++,
      color: COLORS[n % COLORS.length],
      items: [],
      notes: ""
    };
    state.windows.push(w);
    desk.appendChild(buildWindow(w));
    save();
  });
});

/* ================= portable .properties file ================= */

function esc(s) {
  return String(s).replace(/\\/g, "\\\\").replace(/\r/g, "\\r").replace(/\n/g, "\\n");
}
function unesc(s) {
  return String(s).replace(/\\(.)/g, function (m, c) {
    if (c === "n") return "\n";
    if (c === "r") return "\r";
    return c;
  });
}

function toProperties() {
  var L = [];
  L.push("# My Board — portable dashboard data");
  L.push("# Load this file back with the “Load from file” button.");
  L.push("format=myboard-v1");
  L.push("saved=" + new Date().toISOString());
  L.push("window.count=" + state.windows.length);
  state.windows.forEach(function (w, i) {
    var p = "window." + i + ".";
    L.push("");
    L.push(p + "id=" + esc(w.id));
    L.push(p + "title=" + esc(w.title));
    L.push(p + "type=" + esc(w.type));
    L.push(p + "x=" + Math.round(w.x));
    L.push(p + "y=" + Math.round(w.y));
    L.push(p + "w=" + Math.round(w.w));
    L.push(p + "h=" + Math.round(w.h));
    L.push(p + "z=" + w.z);
    L.push(p + "color=" + esc(w.color));
    if (w.type === "notes") L.push(p + "notes=" + esc(w.notes || ""));
    var items = w.items || [];
    L.push(p + "items.count=" + items.length);
    items.forEach(function (it, j) {
      L.push(p + "items." + j + ".text=" + esc(it.text));
      L.push(p + "items." + j + ".done=" + (it.done ? "true" : "false"));
    });
  });
  return L.join("\n") + "\n";
}

function fromProperties(text) {
  var map = {};
  text.split(/\r?\n/).forEach(function (raw) {
    var line = raw.replace(/^\s+/, "");
    if (!line || line.charAt(0) === "#" || line.charAt(0) === "!") return;
    var i = line.indexOf("=");
    if (i < 0) return;
    map[line.slice(0, i).trim()] = unesc(line.slice(i + 1));
  });
  if (map["format"] !== "myboard-v1") throw new Error("Not a My Board properties file");
  var n = parseInt(map["window.count"] || "0", 10);
  var wins = [];
  for (var i = 0; i < n; i++) {
    var p = "window." + i + ".";
    var w = {
      id: map[p + "id"] || uid(),
      title: map[p + "title"] || "Untitled",
      type: map[p + "type"] || "list",
      x: parseFloat(map[p + "x"]) || 30,
      y: parseFloat(map[p + "y"]) || 30,
      w: parseFloat(map[p + "w"]) || 280,
      h: parseFloat(map[p + "h"]) || 240,
      z: parseInt(map[p + "z"], 10) || i + 1,
      color: map[p + "color"] || COLORS[i % COLORS.length],
      notes: map[p + "notes"] || "",
      items: []
    };
    var m = parseInt(map[p + "items.count"] || "0", 10);
    for (var j = 0; j < m; j++) {
      w.items.push({
        text: map[p + "items." + j + ".text"] || "",
        done: map[p + "items." + j + ".done"] === "true"
      });
    }
    wins.push(w);
  }
  var maxZ = 1;
  wins.forEach(function (w) { if (w.z > maxZ) maxZ = w.z; });
  return { windows: wins, nextZ: maxZ + 1 };
}

/* ---------- save / load buttons ---------- */

document.getElementById("exportBtn").addEventListener("click", function () {
  var text = toProperties();
  if (window.showSaveFilePicker) {
    (async function () {
      try {
        if (!fileHandle) {
          fileHandle = await window.showSaveFilePicker({
            suggestedName: "dashboard.properties",
            types: [{ description: "Properties file", accept: { "text/plain": [".properties", ".txt"] } }]
          });
        }
        var wr = await fileHandle.createWritable();
        await wr.write(text);
        await wr.close();
        flash("Saved ✓");
      } catch (e) {
        if (e && e.name === "AbortError") return;
        fileHandle = null;
        downloadFallback(text);
      }
    })();
  } else {
    downloadFallback(text);
  }
});

function downloadFallback(text) {
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
  a.download = "dashboard.properties";
  document.body.appendChild(a);
  a.click();
  a.remove();
  flash("Downloaded ✓");
}

document.getElementById("importBtn").addEventListener("click", function () {
  document.getElementById("importInput").click();
});

document.getElementById("importInput").addEventListener("change", function () {
  var f = this.files[0];
  this.value = "";
  if (!f) return;
  f.text().then(function (text) {
    try {
      state = fromProperties(text);
      save();
      render();
      flash("Loaded ✓");
    } catch (e) {
      alert("Could not load that file: " + e.message);
    }
  });
});

/* ================= boot ================= */

load();
render();

if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  navigator.serviceWorker.register("./sw.js").catch(function () { /* offline support is optional */ });
}
</script>
